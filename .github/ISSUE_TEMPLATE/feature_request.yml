name: Feature request
description: Propose an improvement to SF-Tools.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain who needs this and what they are trying to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include relevant firmware registers or limitations if known.
    validations:
      required: true
