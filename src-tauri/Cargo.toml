[package]
name = "sf-tools"
version = "0.2.1"
description = "SF-Tools - Motor Controller Configuration and Diagnostic Tool"
authors = ["SF Robotics"]
edition = "2021"

[lib]
name = "sf_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4.7.0"
byteorder = "1.5"
parking_lot = "0.12"
log = "0.4"
